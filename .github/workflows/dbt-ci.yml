name: dbt CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbt-checks:
    runs-on: ubuntu-latest

    env:
      DBT_DB_PASSWORD: ${{ secrets.DBT_DB_PASSWORD }}
      DBT_PROFILES_DIR: ${{ github.workspace }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DBT_DB_PASSWORD }}
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d analytics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: python -m pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Load sample orders
        run: dbt seed

      - name: Compile models
        run: dbt compile

      - name: Build model tables
        run: dbt run

      - name: Run data quality tests
        run: dbt test